[project]
name = "intentcart-backend"
version = "0.1.0"
description = "IntentCart API and Google ADK agent scaffold"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "httpcore>=1.0,<2",
  "google-adk>=2.12,<3",
  "google-genai>=2.30,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
]

[project.optional-dependencies]
cloud = ["firebase-admin>=6.6,<8", "google-cloud-firestore>=2.19,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --basetemp=temp_pytest"

[tool.ruff]
line-length = 100
target-version = "py312"
