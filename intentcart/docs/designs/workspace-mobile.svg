<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">IntentCart stylist workspace, mobile concept</title>
  <desc id="desc">Mobile chat view for Mira with session drawer button, Chat and Look tabs, progress stages, and an always-visible message composer.</desc>
  <defs><style>.ui{font-family:Inter,Segoe UI,sans-serif}.serif{font-family:Georgia,serif}.ink{fill:#183d34}.muted{fill:#6b766f}.eye{font:700 8px Inter,Segoe UI,sans-serif;letter-spacing:1.3px;fill:#657568}.small{font:500 9px Inter,Segoe UI,sans-serif}.body{font:400 12px Inter,Segoe UI,sans-serif}.label{font:650 11px Inter,Segoe UI,sans-serif}</style></defs>
  <rect width="390" height="844" fill="#f7f7f2"/>
  <rect width="390" height="58" fill="#fff"/><line x1="0" y1="58" x2="390" y2="58" stroke="#dfe4dc"/><text x="18" y="36" class="ink" font-size="22">☰</text><circle cx="54" cy="29" r="15" fill="#6f805a"/><text x="54" y="34" text-anchor="middle" class="serif" fill="#fff" font-size="14">M</text><text x="78" y="25" class="label ink">Mira</text><text x="78" y="40" class="small muted">Personal Stylist · Smart-casual dinner</text><text x="362" y="35" text-anchor="end" class="ink" font-size="20">•••</text>
  <rect y="58" width="390" height="45" fill="#fff"/><text x="98" y="86" text-anchor="middle" class="label ink">Chat</text><text x="292" y="86" text-anchor="middle" class="label muted">Your look · ₹4,000</text><rect x="20" y="100" width="156" height="3" rx="2" fill="#7f9c4d"/>
  <circle cx="24" cy="19" r="11" fill="#7f9c4d"/><text x="24" y="23" text-anchor="middle" class="ui" fill="#fff" font-size="9" font-weight="700">1</text>

  <g transform="translate(16 125)">
    <rect x="56" y="0" width="302" height="65" rx="10" fill="#edf2e8"/><text x="74" y="23" class="eye">YOU</text><text x="74" y="45" class="body ink">A smart-casual dinner look under ₹4,000.</text>
    <circle cx="20" cy="103" r="18" fill="#6f805a"/><text x="20" y="109" text-anchor="middle" class="serif" fill="#fff" font-size="16">M</text><text x="49" y="99" class="label ink">Mira</text><text x="49" y="119" class="body muted">I’ll plan the budget before searching.</text>
    <rect x="49" y="139" width="309" height="220" rx="10" fill="#fff" stroke="#dfe4dc"/><text x="66" y="163" class="eye">BUILDING YOUR LOOK</text><text x="341" y="163" text-anchor="end" class="small muted">8s</text>
    <circle cx="75" cy="196" r="9" fill="#789756"/><text x="75" y="200" text-anchor="middle" fill="#fff" font-size="10">✓</text><text x="94" y="200" class="body ink">Understanding your request</text>
    <circle cx="75" cy="232" r="9" fill="#789756"/><text x="75" y="236" text-anchor="middle" fill="#fff" font-size="10">✓</text><text x="94" y="236" class="body ink">Checking your preferences</text>
    <circle cx="75" cy="268" r="9" fill="#fff" stroke="#7f9c4d" stroke-width="3"/><text x="94" y="272" class="body ink" font-weight="650">Planning a realistic budget</text>
    <circle cx="75" cy="304" r="9" fill="#fff" stroke="#ccd4c9"/><text x="94" y="308" class="body muted">Searching preferred stores</text>
    <line x1="66" y1="327" x2="341" y2="327" stroke="#e5e9e2"/><text x="66" y="347" class="small muted">You can keep chatting while this runs</text><text x="341" y="347" text-anchor="end" class="small ink">Stop</text>
    <circle cx="349" cy="139" r="11" fill="#7f9c4d"/><text x="349" y="143" text-anchor="middle" class="ui" fill="#fff" font-size="9" font-weight="700">2</text>
  </g>

  <g transform="translate(16 521)">
    <rect width="358" height="132" rx="10" fill="#f0f3e9" stroke="#d9e1d3"/><text x="17" y="26" class="eye">BUDGET PLAN PREVIEW</text><rect x="257" y="12" width="84" height="24" rx="12" fill="#e2edd9"/><text x="299" y="28" text-anchor="middle" class="small" fill="#315b38">✓ Fits total</text>
    <text x="17" y="58" class="label ink">Shirt</text><text x="125" y="58" class="small muted">₹1,200–1,700</text><text x="341" y="58" text-anchor="end" class="label ink">₹1,400</text>
    <text x="17" y="82" class="label ink">Trousers</text><text x="125" y="82" class="small muted">₹1,300–1,800</text><text x="341" y="82" text-anchor="end" class="label ink">₹1,500</text>
    <text x="17" y="106" class="label ink">Footwear</text><text x="125" y="106" class="small muted">₹900–1,400</text><text x="341" y="106" text-anchor="end" class="label ink">₹1,100</text><text x="17" y="124" class="small muted">Open Your look for details and refinements →</text>
  </g>

  <rect x="0" y="673" width="390" height="171" fill="#fff"/><line x1="0" y1="673" x2="390" y2="673" stroke="#dfe4dc"/>
  <rect x="16" y="689" width="358" height="84" rx="11" fill="#fbfcf9" stroke="#cfd8cc"/><text x="33" y="717" class="body muted">Message Mira…</text><text x="33" y="741" class="small muted">Try “Popular stores only”</text><rect x="306" y="705" width="51" height="51" rx="9" fill="#183d34"/><text x="331" y="736" text-anchor="middle" class="label" fill="#fff">Send</text>
  <text x="195" y="798" text-anchor="middle" class="small muted">The composer stays visible while messages scroll.</text><rect x="142" y="825" width="106" height="5" rx="3" fill="#183d34" opacity=".75"/>
</svg>
